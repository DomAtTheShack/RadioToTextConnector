name: Build

# Every push and PR builds all three platforms. Every push to master, every night (when
# there are new commits) and "Run workflow" also publish the builds as the "nightly"
# GitHub release, replacing the last one. Nothing is published unless all three pass.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 7 * * *"          # 07:00 UTC = 3 am Eastern (2 am in winter)
  workflow_dispatch:

permissions:
  contents: write                # Needed to create the release

concurrency:
  group: build-${{ github.ref }}
  # A newer push replaces a running PR build, but never cuts a nightly release short
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HAMLIB_VERSION: "4.7.2"
  DIREWOLF_VERSION: "1.8.1"

jobs:
  # Decides whether this run publishes the nightly. The scheduled run skips it when
  # nothing was committed since the last one
  changes:
    name: Check for new commits
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/master" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            last=$(gh api "repos/${{ github.repository }}/git/ref/tags/nightly" --jq .object.sha 2>/dev/null || true)
            if [ "$last" = "${{ github.sha }}" ]; then
              echo "No new commits since the last nightly"
              echo "release=false" >> "$GITHUB_OUTPUT"
            else
              echo "release=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  windows:
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            unzip
            zip

      # The bundled Hamlib folder is in .gitignore, so fetch the same release
      - name: Download Hamlib
        run: |
          curl -fsSLO "https://github.com/Hamlib/Hamlib/releases/download/${HAMLIB_VERSION}/hamlib-w64-${HAMLIB_VERSION}.zip"
          echo "8553bc6c5c6032e8debf99c017e98f58fed7e07e7c25d04815dc3e8bbe3304c7  hamlib-w64-${HAMLIB_VERSION}.zip" | sha256sum -c
          unzip -q "hamlib-w64-${HAMLIB_VERSION}.zip"

      # The build makes direwolf with Hamlib from source (the official Windows download
      # has no Hamlib). The direwolf folder isn't in the repository, so fetch the release
      - name: Download direwolf source
        run: |
          curl -fsSL -o direwolf.tar.gz "https://github.com/wb2osz/direwolf/archive/refs/tags/${DIREWOLF_VERSION}.tar.gz"
          echo "89d5f7992ae1e74d8cf26ec6479dde74d1f480bde950043756e875a689d065d7  direwolf.tar.gz" | sha256sum -c
          mkdir direwolf
          tar xzf direwolf.tar.gz -C direwolf --strip-components=1

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DHAMPROOF_STATIC=ON
          cmake --build build

      # There's no minimodem build for this runner, so its cases report "skipped"; the
      # packet cases are decoded with the atest built above
      # -V prints every case, so the log shows each result, not just pass/fail. The test
      # program also writes a table to the job summary and annotates any failure
      - name: Unit tests
        run: ctest --test-dir build -R "^unit$" -V

      - name: Audio tests (decode tests/audio with minimodem and atest)
        if: success() || failure()          # Still run when the unit tests failed
        run: ctest --test-dir build -R "^audio$" -V

      - name: CAT test (Hamlib dummy rig)
        if: success() || failure()
        run: build/bin/cat_test.exe x 1

      - name: Package
        run: |
          mkdir -p dist/Radio-to-Text-Connector
          cp build/bin/RadioToTextConnector.exe build/bin/RadioConnector.exe build/bin/cat_test.exe build/bin/direwolf.exe build/bin/atest.exe build/bin/gen_packets.exe build/bin/*.dll README.md LICENSE dist/Radio-to-Text-Connector/
          cp -r build/bin/test-audio dist/Radio-to-Text-Connector/
          cd dist && zip -qr Radio-to-Text-Connector-windows-x64.zip Radio-to-Text-Connector

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/Radio-to-Text-Connector-windows-x64.zip

  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build pkg-config libasound2-dev libusb-1.0-0-dev libudev-dev
          # Only for the audio tests, which decode tests/audio with them
          sudo apt-get install -y minimodem direwolf
          # CMakeLists.txt asks for CMake 4.1 or newer, newer than Ubuntu's
          pipx install cmake
          cmake --version

      # Hamlib built from source like on a dev machine, but static only so it ends up
      # inside the binary. Cached, so this only takes minutes the first time
      - name: Cache Hamlib
        id: hamlib-cache
        uses: actions/cache@v6
        with:
          path: ~/hamlib
          key: hamlib-${{ env.HAMLIB_VERSION }}-ubuntu-24.04-static

      - name: Build Hamlib
        if: steps.hamlib-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSLO "https://github.com/Hamlib/Hamlib/releases/download/${HAMLIB_VERSION}/hamlib-${HAMLIB_VERSION}.tar.gz"
          echo "ae1fcf2dbc80ea0786ea8f047b09399c3f7737d1930442f61a031708ed33e88f  hamlib-${HAMLIB_VERSION}.tar.gz" | sha256sum -c
          tar xzf "hamlib-${HAMLIB_VERSION}.tar.gz"
          cd "hamlib-${HAMLIB_VERSION}"
          ./configure --prefix="$HOME/hamlib" --disable-shared --enable-static --without-cxx-binding
          make -j"$(nproc)"
          make install

      - name: Build
        run: |
          export PKG_CONFIG_PATH="$HOME/hamlib/lib/pkgconfig"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DHAMPROOF_STATIC=ON \
                -DCMAKE_PREFIX_PATH="$HOME/hamlib"
          cmake --build build

      - name: Show linked libraries
        run: ldd build/RadioToTextConnector

      # -V prints every case, so the log shows each result, not just pass/fail. The test
      # program also writes a table to the job summary and annotates any failure
      - name: Unit tests
        run: ctest --test-dir build -R "^unit$" -V

      - name: Audio tests (decode tests/audio with minimodem and atest)
        if: success() || failure()          # Still run when the unit tests failed
        run: ctest --test-dir build -R "^audio$" -V

      - name: CAT test (Hamlib dummy rig)
        if: success() || failure()
        run: build/cat_test x 1

      - name: Package
        run: |
          mkdir -p dist/Radio-to-Text-Connector
          cp build/RadioToTextConnector build/RadioConnector build/cat_test README.md LICENSE APT-PACKAGES.txt dist/Radio-to-Text-Connector/
          cp -r build/test-audio dist/Radio-to-Text-Connector/
          tar -C dist -czf dist/Radio-to-Text-Connector-linux-x64.tar.gz Radio-to-Text-Connector

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/Radio-to-Text-Connector-linux-x64.tar.gz

  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-latest        # Apple Silicon
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          brew update
          # The runner image links another OpenSSL's bin/openssl, so upgrading openssl@4
          # (for PulseAudio) would overwrite it with a warning. Unlink them all first
          for keg in $(brew list --formula | grep '^openssl@' || true); do brew unlink "$keg"; done
          # minimodem pulls in PulseAudio, which the device list links against
          brew install cmake ninja pkgconf hamlib minimodem
          # Only for the packet audio tests; they're skipped if it can't be installed
          brew install direwolf || echo "direwolf not installed; packet audio tests will be skipped"
          cmake --version

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DHAMPROOF_STATIC=ON
          cmake --build build

      - name: Show linked libraries
        run: otool -L build/RadioToTextConnector

      # -V prints every case, so the log shows each result, not just pass/fail. The test
      # program also writes a table to the job summary and annotates any failure
      - name: Unit tests
        run: ctest --test-dir build -R "^unit$" -V

      - name: Audio tests (decode tests/audio with minimodem and atest)
        if: success() || failure()          # Still run when the unit tests failed
        run: ctest --test-dir build -R "^audio$" -V

      - name: CAT test (Hamlib dummy rig)
        if: success() || failure()
        run: build/cat_test x 1

      - name: Package
        run: |
          mkdir -p dist/Radio-to-Text-Connector
          cp build/RadioToTextConnector build/RadioConnector build/cat_test README.md LICENSE dist/Radio-to-Text-Connector/
          cp -r build/test-audio dist/Radio-to-Text-Connector/
          tar -C dist -czf dist/Radio-to-Text-Connector-macos-arm64.tar.gz Radio-to-Text-Connector

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/Radio-to-Text-Connector-macos-arm64.tar.gz

  release:
    name: Publish nightly release
    needs: [changes, windows, linux, macos]
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          short=$(echo "${{ github.sha }}" | cut -c1-7)
          today=$(date -u +%Y-%m-%d)
          cat > notes.md <<EOF
          Automatic build of \`${short}\` from ${today}. Untested; may be broken.

          **Windows:** unzip and run \`RadioToTextConnector.exe\`. Keep the DLLs and the
          direwolf programs next to it (direwolf is included, built with Hamlib). minimodem
          has to be installed separately (Cygwin build).

          **Linux:** \`tar xzf\`, then \`./RadioToTextConnector\`. Needs ALSA, libusb, and
          minimodem and/or direwolf (see APT-PACKAGES.txt).

          **macOS (Apple Silicon):** \`brew install hamlib minimodem direwolf && brew services start pulseaudio\`,
          then \`tar xzf\` and \`./RadioToTextConnector\`. If macOS blocks it, run
          \`xattr -d com.apple.quarantine RadioToTextConnector RadioConnector cat_test\` first.
          EOF
          # Replace the previous nightly (release and tag) with this one
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly dist/* \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Nightly ${today} (${short})" \
            --notes-file notes.md
